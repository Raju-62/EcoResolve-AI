spring.application.name=ecoresolve-backend
spring.profiles.active=${SPRING_PROFILE:h2}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:EcoResolveDevSecretKeyChangeThisBeforeProduction123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
